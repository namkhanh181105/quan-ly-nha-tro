<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản Lý Loại Phòng - BQL Nhà Trọ CCMN</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../assets/css/common.css">
  <link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body>
  <div class="admin-wrapper">
    <div id="admin-sidebar"></div>

    <div class="admin-main">
      <div id="admin-header"></div>

      <main class="admin-content">
        <div class="d-flex justify-content-between align-items-center mb-4">
          <div>
            <h4 class="fw-bold mb-1">Danh Mục Loại Phòng</h4>
            <p class="text-muted small mb-0">Quản lý các loại hình căn hộ (Studio, gác lửng, tách bếp, phòng đơn)</p>
          </div>
          <div>
            <!-- NÚT: #btnAddCategory (Mở modal thêm loại phòng mới, chỉ thao tác Frontend) -->
            <button class="btn btn-primary" id="btnAddCategory">
              <i class="bi bi-plus-circle me-1"></i> Thêm loại phòng
            </button>
          </div>
        </div>

        <div class="table-responsive">
          <table class="table table-hover table-custom" id="categoriesTable">
            <thead>
              <tr>
                <th style="width: 60px;">ID</th>
                <th>Tên loại phòng</th>
                <th>Đường dẫn tĩnh (Slug)</th>
                <th>Mô tả tóm tắt</th>
                <th>Số lượng phòng</th>
                <th style="width: 120px;" class="text-center">Thao tác</th>
              </tr>
            </thead>
            <tbody id="categoriesTableBody">
              <tr>
                <td colspan="6" class="text-center py-4 text-muted">
                  <div class="spinner-border spinner-border-sm text-primary me-2"></div> Đang tải...
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </main>
    </div>
  </div>

  <!-- MODAL THÊM / SỬA LOẠI PHÒNG (#categoryModal) -->
  <div class="modal fade" id="categoryModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <form id="categoryForm" class="modal-content">
        <div class="modal-header">
            <h5 class="modal-title fw-bold" id="categoryModalTitle">Thêm loại phòng mới</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="categoryId" name="id">
            <div class="mb-3">
              <label class="form-label small fw-semibold">Tên loại phòng <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="categoryName" name="name" required placeholder="VD: Căn hộ Studio có ban công">
            </div>
            <div class="mb-3">
              <label class="form-label small fw-semibold">Slug (Tùy chọn, tự sinh nếu để trống)</label>
              <input type="text" class="form-control" id="categorySlug" name="slug" placeholder="can-ho-studio-ban-cong">
            </div>
            <div class="mb-3">
              <label class="form-label small fw-semibold">Mô tả đặc điểm</label>
              <textarea class="form-control" id="categoryDescription" name="description" rows="3" placeholder="Mô tả ưu thế, thiết kế không gian..."></textarea>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-light border" data-bs-dismiss="modal">Đóng</button>
            <!-- NÚT: #btnSaveCategory (Lưu loại phòng: POST create.php hoặc update.php) -->
            <button type="submit" class="btn btn-primary" id="btnSaveCategory">
              <i class="bi bi-save me-1"></i> Lưu loại phòng
            </button>
          </div>
        </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/components.js"></script>
  <script src="../assets/js/admin/categories.js"></script>
</body>
</html>
