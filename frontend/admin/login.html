<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng Nhập Quản Trị - CCMN KhánhKaKa</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../assets/css/common.css">
  <style>
    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login-card {
      background: #ffffff;
      border-radius: 16px;
      padding: 40px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
      width: 100%;
      max-width: 420px;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="text-center mb-4">
      <div class="d-inline-flex p-3 rounded-circle bg-primary bg-opacity-10 text-primary mb-3">
        <i class="bi bi-shield-lock-fill fs-2"></i>
      </div>
      <h4 class="fw-bold text-dark mb-1">CỔNG QUẢN TRỊ</h4>
      <p class="text-muted small">Ban Quản Lý Chung Cư Mini KhánhKaKa</p>
    </div>

    <!--
      FORM ĐĂNG NHẬP ADMIN: #adminLoginForm
      - Nút submit: #btnLogin
      - Xử lý: frontend/assets/js/admin/auth.js
      - Gọi API: POST backend/api/auth/admin_login.php
      - Dữ liệu gửi: { username: "...", password: "..." }
    -->
    <form id="adminLoginForm">
      <div class="mb-3">
        <label class="form-label small fw-semibold text-secondary">Tên đăng nhập</label>
        <div class="input-group">
          <span class="input-group-text bg-light border-end-0"><i class="bi bi-person"></i></span>
          <input type="text" class="form-control border-start-0" id="username" name="username" placeholder="admin" required autofocus>
        </div>
      </div>

      <div class="mb-4">
        <label class="form-label small fw-semibold text-secondary">Mật khẩu</label>
        <div class="input-group">
          <span class="input-group-text bg-light border-end-0"><i class="bi bi-key"></i></span>
          <input type="password" class="form-control border-start-0" id="password" name="password" placeholder="••••••••" required>
        </div>
      </div>

      <!--
        NÚT: #btnLogin (Gửi thông tin xác thực)
        - Gọi: POST backend/api/auth/admin_login.php
      -->
      <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold" id="btnLogin">
        <i class="bi bi-box-arrow-in-right me-1"></i> Đăng nhập hệ thống
      </button>
    </form>

    <div class="mt-4 pt-3 border-top text-center">
      <div class="small text-muted mb-2">Tài khoản mặc định: <strong>admin</strong> / <strong>admin123</strong></div>
      <div class="d-flex justify-content-between small">
        <a href="../public/index.html" class="text-decoration-none text-secondary">
          <i class="bi bi-arrow-left me-1"></i> Quay về trang chủ
        </a>
        <a href="../tenant/login.html" class="text-decoration-none text-success fw-semibold">
          <i class="bi bi-door-open-fill me-1"></i> Cổng Cư Dân
        </a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/admin/auth.js"></script>
</body>
</html>
