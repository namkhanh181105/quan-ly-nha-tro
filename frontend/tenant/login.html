<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng Nhập Cổng Cư Dân - CCMN</title>
  <!-- Bootstrap 5 CSS & Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../assets/css/common.css">
  <link rel="stylesheet" href="../assets/css/tenant.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100 py-5">

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5 col-xl-4">
        <div class="card border-0 shadow-lg rounded-4 p-4 p-md-5 bg-white">
          <div class="text-center mb-4">
            <div class="icon-circle bg-success-subtle text-success mx-auto mb-3" style="width: 64px; height: 64px; border-radius: 50%; display: flex; align-items: center; justify-content: center;">
              <i class="bi bi-person-badge-fill fs-2"></i>
            </div>
            <h4 class="fw-bold text-dark mb-1">CỔNG CƯ DÂN</h4>
            <p class="text-muted small mb-0">Hệ thống tra cứu hợp đồng, hóa đơn và nộp bill chuyển khoản</p>
          </div>

          <!-- FORM: #tenantLoginForm (Gửi POST backend/api/auth/tenant_login.php) -->
          <form id="tenantLoginForm">
            <div class="mb-3">
              <label class="form-label small fw-semibold text-secondary">Số điện thoại hoặc Email cư dân <span class="text-danger">*</span></label>
              <div class="input-group">
                <span class="input-group-text bg-white border-end-0"><i class="bi bi-person-badge text-muted"></i></span>
                <input type="text" class="form-control border-start-0 ps-0" id="tenantLoginInput" required placeholder="Nhập Số điện thoại (0981...) hoặc Email">
              </div>
            </div>

            <div class="mb-4">
              <label class="form-label small fw-semibold text-secondary">Mật khẩu truy cập <span class="text-danger">*</span></label>
              <div class="input-group">
                <span class="input-group-text bg-white border-end-0"><i class="bi bi-lock text-muted"></i></span>
                <input type="password" class="form-control border-start-0 ps-0" id="tenantPassword" required placeholder="••••••••">
              </div>
            </div>

            <!-- NÚT: #btnTenantLogin (Submit form đăng nhập) -->
            <button type="submit" class="btn btn-success w-100 py-2 fw-bold shadow-sm" id="btnTenantLogin">
              <i class="bi bi-box-arrow-in-right me-1"></i> Đăng nhập Cổng Cư Dân
            </button>
          </form>

          <div class="mt-4 pt-3 border-top text-center small text-muted">
            <i class="bi bi-info-circle me-1 text-primary"></i> Đăng nhập bằng <strong>Số điện thoại</strong> hoặc <strong>Email</strong> cư dân.<br>
            <span class="text-secondary small">Mẫu: SĐT <code>0981234567</code> hoặc Email <code>tenant1@thongnhat.vn</code> | MK: <code>tenant123</code></span>
          </div>

          <div class="text-center mt-3 pt-2 border-top small">
            <span class="text-muted">Chưa có tài khoản cư dân?</span> 
            <a href="../public/register.html" class="fw-bold text-success text-decoration-none ms-1">
              <i class="bi bi-person-plus-fill me-1"></i> Đăng ký Cư Dân mới
            </a>
          </div>

          <div class="text-center mt-3 small d-flex justify-content-between align-items-center">
            <a href="../public/index.html" class="text-decoration-none text-secondary">
              <i class="bi bi-arrow-left me-1"></i> Trở về Trang chủ
            </a>
            <a href="../admin/login.html" class="text-decoration-none text-dark fw-semibold">
              <i class="bi bi-shield-lock-fill text-warning me-1"></i> Cổng Quản Trị (Admin)
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/tenant/auth.js"></script>
</body>
</html>
