<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bảng Tin &amp; Thông Báo Tòa Nhà - Cổng Cư Dân CCMN</title>
  <!-- Bootstrap 5 CSS & Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../assets/css/common.css">
  <link rel="stylesheet" href="../assets/css/tenant.css">
</head>
<body>
  <div class="tenant-wrapper">
    <!-- SIDEBAR CƯ DÂN -->
    <div id="tenant-sidebar"></div>

    <div class="tenant-main">
      <!-- HEADER CƯ DÂN -->
      <div id="tenant-header"></div>

      <main class="tenant-content">
        <div class="d-flex justify-content-between align-items-center mb-4">
          <div>
            <h4 class="fw-bold mb-1">Bảng Tin &amp; Thông Báo Từ Ban Quản Lý</h4>
            <p class="text-muted small mb-0">Theo dõi thông báo lịch cắt điện nước, bảo trì thang máy, nội quy an ninh và thông báo cá nhân</p>
          </div>
          <div>
            <!-- NÚT: #btnReloadNotifications (Tải lại thông báo) -->
            <button class="btn btn-light border btn-sm" id="btnReloadNotifications" title="Tải lại">
              <i class="bi bi-arrow-clockwise me-1"></i> Tải lại
            </button>
          </div>
        </div>

        <!-- BỘ LỌC THÔNG BÁO -->
        <div class="card border-0 shadow-sm rounded-4 p-3 bg-white mb-4">
          <ul class="nav nav-pills" id="notificationFilterTabs">
            <li class="nav-item">
              <button class="nav-link active fw-semibold" data-filter="all">Tất cả thông báo</button>
            </li>
            <li class="nav-item">
              <button class="nav-link fw-semibold" data-filter="general">Thông báo chung tòa nhà</button>
            </li>
            <li class="nav-item">
              <button class="nav-link fw-semibold" data-filter="personal">Thông báo gửi riêng cho tôi</button>
            </li>
          </ul>
        </div>

        <!-- KHU VỰC HIỂN THỊ CÁC THÔNG BÁO (#tenantNotificationsContainer) -->
        <div class="row g-3" id="tenantNotificationsContainer">
          <div class="col-12 text-center py-5 text-muted">
            <div class="spinner-border spinner-border-sm text-primary me-2"></div> Đang tải thông báo...
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/components.js"></script>
  <script src="../assets/js/tenant/notifications.js"></script>
</body>
</html>
