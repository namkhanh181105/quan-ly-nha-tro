<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Danh Sách Phòng Trọ &amp; Căn Hộ Đang Cho Thuê</title>
  <!-- Bootstrap 5 CSS & Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../assets/css/common.css">
  <link rel="stylesheet" href="../assets/css/public.css">
</head>
<body class="bg-light">

  <!-- HEADER DÙNG CHUNG (Tự động nạp qua components.js từ components/public-header.html) -->
  <div id="public-header"></div>

  <!-- BANNER ĐẦU TRANG -->
  <div class="bg-primary text-white py-4 mb-4">
    <div class="container">
      <div class="row align-items-center">
        <div class="col-md-8">
          <nav aria-label="breadcrumb">
            <ol class="breadcrumb mb-1 text-white-50 small">
              <li class="breadcrumb-item"><a href="index.html" class="text-white text-decoration-none">Trang chủ</a></li>
              <li class="breadcrumb-item active text-white fw-semibold" aria-current="page">Danh sách phòng</li>
            </ol>
          </nav>
          <h2 class="fw-bold mb-0">Tìm Kiếm Phòng Trọ Phù Hợp</h2>
        </div>
        <div class="col-md-4 text-md-end mt-2 mt-md-0">
          <span class="badge bg-light text-primary px-3 py-2 rounded-pill fs-6 fw-bold" id="totalRoomsCount">
            Đang tìm kiếm...
          </span>
        </div>
      </div>
    </div>
  </div>

  <div class="container pb-5">
    <div class="row g-4">
      <!-- CỘT BỘ LỌC BÊN TRÁI (FILTER SIDEBAR) -->
      <div class="col-lg-3">
        <div class="card border-0 shadow-sm rounded-4 p-4 sticky-top" style="top: 85px;">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="fw-bold mb-0"><i class="bi bi-funnel-fill text-primary me-2"></i>Bộ Lọc Tìm Kiếm</h5>
            <!-- NÚT: #btnResetFilter (Đặt lại toàn bộ tiêu chí lọc về mặc định) -->
            <button type="button" class="btn btn-link btn-sm text-decoration-none text-muted p-0" id="btnResetFilter">
              <i class="bi bi-arrow-counterclockwise me-1"></i>Đặt lại
            </button>
          </div>

          <!-- FORM: #roomFilterForm (Gửi các tiêu chí lọc qua Fetch API tới GET backend/api/public/rooms/list.php) -->
          <form id="roomFilterForm">
            <!-- TỪ KHÓA TÌM KIẾM -->
            <div class="mb-3">
              <label class="form-label small fw-semibold text-secondary">Từ khóa / Số phòng</label>
              <div class="input-group">
                <span class="input-group-text bg-white border-end-0"><i class="bi bi-search text-muted"></i></span>
                <input type="text" class="form-control border-start-0 ps-0" id="filterKeyword" placeholder="VD: 101, ban công...">
              </div>
            </div>

            <!-- LOẠI PHÒNG -->
            <div class="mb-3">
              <label class="form-label small fw-semibold text-secondary">Loại phòng</label>
              <select class="form-select" id="filterCategory">
                <option value="">Tất cả loại phòng</option>
                <!-- Nạp bằng JS qua filter_options.php -->
              </select>
            </div>

            <!-- KHU VỰC -->
            <div class="mb-3">
              <label class="form-label small fw-semibold text-secondary">Khu vực / Tòa nhà</label>
              <select class="form-select" id="filterLocation">
                <option value="">Tất cả khu vực</option>
                <!-- Nạp bằng JS qua filter_options.php -->
              </select>
            </div>

            <!-- TẦNG -->
            <div class="mb-3">
              <label class="form-label small fw-semibold text-secondary">Số tầng</label>
              <select class="form-select" id="filterFloor">
                <option value="">Tất cả các tầng</option>
                <option value="1">Tầng 1</option>
                <option value="2">Tầng 2</option>
                <option value="3">Tầng 3</option>
                <option value="4">Tầng 4</option>
                <option value="5">Tầng 5</option>
              </select>
            </div>

            <!-- KHOẢNG GIÁ (MIN - MAX) -->
            <div class="mb-3">
              <label class="form-label small fw-semibold text-secondary">Khoảng giá thuê (VNĐ/tháng)</label>
              <div class="row g-2">
                <div class="col-6">
                  <input type="number" class="form-control form-control-sm" id="filterMinPrice" placeholder="Từ (VNĐ)" step="100000">
                </div>
                <div class="col-6">
                  <input type="number" class="form-control form-control-sm" id="filterMaxPrice" placeholder="Đến (VNĐ)" step="100000">
                </div>
              </div>
            </div>

            <!-- TRẠNG THÁI PHÒNG -->
            <div class="mb-4">
              <label class="form-label small fw-semibold text-secondary">Trạng thái phòng</label>
              <select class="form-select" id="filterStatus">
                <option value="available" selected>Còn trống (sẵn sàng ở)</option>
                <option value="">Tất cả trạng thái</option>
                <option value="rented">Đang cho thuê</option>
                <option value="maintenance">Đang bảo trì</option>
              </select>
            </div>

            <!-- NÚT: #btnApplyFilter (Submit form kích hoạt tải lại danh sách) -->
            <button type="submit" class="btn btn-primary w-100 fw-semibold py-2" id="btnApplyFilter">
              <i class="bi bi-filter me-1"></i> Áp dụng bộ lọc
            </button>
          </form>
        </div>
      </div>

      <!-- CỘT DANH SÁCH PHÒNG BÊN PHẢI -->
      <div class="col-lg-9">
        <!-- THANH CÔNG CỤ SẮP XẾP -->
        <div class="card border-0 shadow-sm rounded-4 p-3 mb-4 bg-white">
          <div class="row align-items-center g-2">
            <div class="col-sm-6 text-muted small" id="filterSummaryText">
              Hiển thị kết quả tìm kiếm phòng trọ mới nhất
            </div>
            <div class="col-sm-6 text-sm-end">
              <div class="d-inline-flex align-items-center gap-2">
                <label for="filterSort" class="small fw-semibold text-secondary text-nowrap">Sắp xếp:</label>
                <!-- SELECT: #filterSort (Bắt sự kiện change để tải lại danh sách theo thứ tự) -->
                <select class="form-select form-select-sm" id="filterSort" style="width: auto;">
                  <option value="created_desc">Mới nhất</option>
                  <option value="price_asc">Giá tăng dần</option>
                  <option value="price_desc">Giá giảm dần</option>
                  <option value="area_desc">Diện tích lớn nhất</option>
                </select>
              </div>
            </div>
          </div>
        </div>

        <!-- DANH SÁCH THẺ PHÒNG RENDER BẰNG JS (#roomsListContainer) -->
        <div class="row g-4" id="roomsListContainer">
          <div class="col-12 text-center py-5">
            <div class="spinner-border text-primary" role="status"></div>
            <p class="text-muted mt-2">Đang tải danh sách phòng...</p>
          </div>
        </div>

        <!-- PHÂN TRANG AJAX (#roomsPagination) -->
        <div class="d-flex justify-content-center mt-5" id="roomsPaginationContainer">
          <nav>
            <ul class="pagination pagination-custom" id="roomsPagination">
              <!-- Render các nút số trang bằng JavaScript -->
            </ul>
          </nav>
        </div>
      </div>
    </div>
  </div>

  <!-- FOOTER DÙNG CHUNG (Tự động nạp qua components.js từ components/public-footer.html) -->
  <div id="public-footer"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/components.js"></script>
  <script src="../assets/js/public/rooms.js"></script>
</body>
</html>
