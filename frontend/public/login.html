<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cổng Đăng Nhập - CCMN KhánhKaKa</title>
  <!-- Bootstrap 5 CSS & Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../assets/css/common.css">
  <link rel="stylesheet" href="../assets/css/public.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

  <!-- HEADER DÙNG CHUNG -->
  <div id="public-header"></div>

  <!-- NỘI DUNG CHỌN CỔNG ĐĂNG NHẬP -->
  <main class="flex-grow-1 d-flex align-items-center py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
          <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 bg-white text-center">
            <div class="icon-circle bg-primary-subtle text-primary mx-auto mb-3" style="width: 64px; height: 64px; border-radius: 50%; display: flex; align-items: center; justify-content: center;">
              <i class="bi bi-buildings-fill fs-2"></i>
            </div>
            <h4 class="fw-bold text-dark mb-1">CỔNG TRUY CẬP HỆ THỐNG</h4>
            <p class="text-muted small mb-4">Vui lòng lựa chọn phân hệ đăng nhập bên dưới</p>

            <div class="d-grid gap-3">
              <!-- NÚT ĐĂNG NHẬP CỔNG CƯ DÂN -->
              <a href="../tenant/login.html" class="btn btn-success py-3 px-4 fw-bold shadow-sm d-flex align-items-center justify-content-center gap-2 fs-6">
                <i class="bi bi-door-open-fill fs-4"></i>
                <div class="text-start">
                  <div>ĐĂNG NHẬP CỔNG CƯ DÂN</div>
                  <small class="fw-normal opacity-75 d-block" style="font-size: 0.75rem;">Tra cứu hợp đồng, hóa đơn điện nước & nộp bill</small>
                </div>
              </a>

              <!-- NÚT ĐĂNG NHẬP ADMIN BQL -->
              <a href="../admin/login.html" class="btn btn-warning py-3 px-4 fw-bold shadow-sm text-dark d-flex align-items-center justify-content-center gap-2 fs-6">
                <i class="bi bi-shield-lock-fill fs-4"></i>
                <div class="text-start">
                  <div>ĐĂNG NHẬP ADMIN (BQL)</div>
                  <small class="fw-normal opacity-75 d-block" style="font-size: 0.75rem;">Quản lý phòng trọ, phê duyệt cư dân & hóa đơn</small>
                </div>
              </a>
            </div>

            <div class="mt-4 pt-3 border-top small text-muted">
              Chưa có tài khoản cư dân? 
              <a href="register.html" class="fw-bold text-primary text-decoration-none">
                <i class="bi bi-person-plus-fill me-1"></i> Đăng ký làm Cư Dân ngay
              </a>
            </div>

            <div class="mt-2 small">
              <a href="index.html" class="text-secondary text-decoration-none">
                <i class="bi bi-arrow-left me-1"></i> Quay về Trang chủ
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- FOOTER DÙNG CHUNG -->
  <div id="public-footer"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/components.js"></script>
</body>
</html>
