<!--
  ============================================================================
  COMPONENT: HEADER QUẢN TRỊ (ADMIN HEADER)
  ============================================================================
  Mục đích: Thanh tiêu đề trên cùng trang Admin, hiển thị thông tin quản trị viên và nút đăng xuất.
-->
<header class="admin-header">
  <div class="d-flex align-items-center gap-3">
    <button class="btn btn-sm btn-light border d-lg-none" type="button" id="sidebarToggle">
      <i class="bi bi-list"></i>
    </button>
    <h5 class="mb-0 fw-bold text-dark" id="page-title">Trang quản trị</h5>
  </div>

  <div class="d-flex align-items-center gap-3">
    <div class="d-flex align-items-center gap-2">
      <div class="text-end d-none d-sm-block">
        <div class="fw-semibold text-dark small" id="admin-fullname-display">Quản Trị Viên</div>
        <span class="badge bg-primary-subtle text-primary border border-primary-subtle" style="font-size: 0.7rem;" id="admin-role-badge">Superadmin</span>
      </div>
      <img src="../assets/images/default-avatar.png" alt="Avatar" class="rounded-circle border" width="38" height="38">
    </div>

    <!-- Nút Đăng xuất Admin: Gọi API auth/admin_logout.php xử lý tại components.js -->
    <button class="btn btn-outline-danger btn-sm px-3" id="btnAdminLogout" title="Đăng xuất tài khoản">
      <i class="bi bi-box-arrow-right me-1"></i> Đăng xuất
    </button>
  </div>
</header>
