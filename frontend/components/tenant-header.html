<!--
  ============================================================================
  COMPONENT: HEADER CỔNG CƯ DÂN (TENANT HEADER)
  ============================================================================
  Mục đích: Hiển thị phòng thuê hiện tại, tên cư dân và nút đăng xuất Cổng cư dân.
-->
<header class="tenant-header">
  <div class="d-flex align-items-center gap-3">
    <button class="btn btn-sm btn-light border d-lg-none" type="button" id="tenantSidebarToggle">
      <i class="bi bi-list"></i>
    </button>
    <h5 class="mb-0 fw-bold text-dark" id="tenant-page-title">Cổng thông tin cư dân</h5>
  </div>

  <div class="d-flex align-items-center gap-3">
    <div class="d-flex align-items-center gap-2">
      <div class="text-end d-none d-sm-block">
        <div class="fw-semibold text-dark small" id="tenant-name-display">Cư dân</div>
        <span class="badge bg-success-subtle text-success border border-success-subtle" style="font-size: 0.7rem;" id="tenant-room-badge">Phòng ---</span>
      </div>
      <img src="../assets/images/default-avatar.png" alt="Avatar" class="rounded-circle border" width="38" height="38">
    </div>

    <!-- Nút Đăng xuất Cổng cư dân: Gọi API auth/tenant_logout.php xử lý tại components.js -->
    <button class="btn btn-outline-danger btn-sm px-3" id="btnTenantLogout" title="Đăng xuất Cổng cư dân">
      <i class="bi bi-box-arrow-right me-1"></i> Đăng xuất
    </button>
  </div>
</header>
